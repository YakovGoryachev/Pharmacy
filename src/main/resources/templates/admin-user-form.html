<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(${pageTitle}, ${activeNav}, ~{::section})}">
<section th:fragment="section" class="card">
    <form th:action="@{/admin/users/save}" method="post" th:object="${user}">
        <input type="hidden" th:field="*{id}"/>
        <div class="form-group"><label>Логин</label><input th:field="*{login}" class="form-control" required/></div>
        <div class="form-group"><label>ФИО</label><input th:field="*{name}" class="form-control"/></div>
        <div class="form-group"><label>Пароль</label><input type="password" name="password" class="form-control" required/></div>
        <div class="form-group"><label>Роль</label>
            <select name="roleId" class="form-control">
                <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.description}"></option>
            </select>
        </div>
        <div class="form-group"><label>Аптека</label>
            <select name="pharmacyId" class="form-control">
                <option value="">—</option>
                <option th:each="p : ${pharmacies}" th:value="${p.id}" th:text="${p.name}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</section>
</html>
