<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(${pageTitle}, ${activeNav}, ~{::section})}">
<section th:fragment="section" class="card">
    <div class="card-header" style="margin:-1.5rem -1.5rem 1rem;padding:1rem 1.5rem">
        <h2 style="margin:0">Возврат от покупателя</h2>
        <a th:href="@{/cashier}" class="btn btn-secondary btn-sm">← К кассе</a>
    </div>
    <div class="table-responsive">
        <table class="data-table">
            <thead><tr><th>Чек</th><th class="text-right">Сумма</th><th>Дата</th><th>Статус</th><th></th></tr></thead>
            <tbody>
            <tr th:each="c : ${cheques}">
                <td th:text="${c.numberCheque}">n</td>
                <td class="text-right" th:text="${#numbers.formatDecimal(c.totalAmount / 100.0, 1, 2)} + ' ₽'">0</td>
                <td th:text="${#temporals.format(c.createdAt, 'dd.MM.yyyy HH:mm')}">d</td>
                <td>
                    <span th:if="${c.isReturned}" class="badge badge-neutral">Возвращён</span>
                    <span th:unless="${c.isReturned}" class="badge badge-success">Продан</span>
                </td>
                <td>
                    <form th:if="${!c.isReturned}" th:action="@{'/cashier/returns/' + ${c.id}}" method="post">
                        <button type="submit" class="btn btn-sm btn-warning">Оформить возврат</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${cheques.isEmpty()}">
                <td colspan="5" class="text-center text-muted">Продаж пока нет</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</html>
