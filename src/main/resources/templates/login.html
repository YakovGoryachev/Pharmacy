<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Вход — PharmaControl</title>
    <link rel="stylesheet" th:href="@{/css/style-uni.css}"/>
</head>
<body class="login-page" style="display:flex;align-items:center;justify-content:center;min-height:100vh">
<div class="card" style="width:400px;padding:2rem">
    <h1 style="margin-bottom:1rem">PharmaControl</h1>
    <div th:if="${param.error}" class="alert alert-danger">Неверный логин или пароль</div>
    <div th:if="${param.logout}" class="alert alert-success">Вы вышли из системы</div>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Логин</label>
            <input type="text" name="username" class="form-control" required autofocus/>
        </div>
        <div class="form-group" style="margin-top:1rem">
            <label>Пароль</label>
            <input type="password" name="password" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:1.5rem">Войти</button>
    </form>
    <p style="margin-top:1rem;font-size:0.85rem;color:#64748b">
        Демо: pharm1/pharm123, manager1/mgr123, admin/admin123, accountant/acc123
    </p>
</div>
</body>
</html>
