<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(${pageTitle}, ${activeNav}, ~{::section})}">
<section th:fragment="section">
    <div class="breadcrumb">
        <a th:href="@{/nomenclature}">Номенклатура</a> <span class="breadcrumb-sep">/</span> <span>Категории</span>
    </div>

    <div class="card" style="max-width:640px;margin-bottom:1.5rem">
        <div class="card-header"><h3 style="margin:0">Добавить категорию</h3></div>
        <form th:action="@{/nomenclature/categories/save}" method="post" class="card-body">
            <div class="form-group">
                <label class="form-label">Название</label>
                <input type="text" name="name" class="form-control" required placeholder="Напр. Обезболивающие"/>
            </div>
            <div class="form-group">
                <label class="form-label">Код (необязательно)</label>
                <input type="text" name="code" class="form-control" placeholder="PAIN"/>
            </div>
            <label class="form-check" th:if="${canManageSystem}" style="margin-bottom:1rem">
                <input type="checkbox" name="system" value="true"/>
                <span>Системная категория (только администратор)</span>
            </label>
            <p class="text-sm text-muted" th:unless="${canManageSystem}">
                Заведующий может добавлять только пользовательские категории. Системные категории создаёт администратор.
            </p>
            <button type="submit" class="btn btn-primary btn-sm">Добавить</button>
        </form>
    </div>

    <div class="card">
        <div class="card-header"><h3 style="margin:0">Справочник категорий</h3></div>
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                <tr><th>Название</th><th>Код</th><th>Тип</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="c : ${categories}">
                    <td th:text="${c.name}">—</td>
                    <td th:text="${c.code != null ? c.code : '—'}">—</td>
                    <td>
                        <span th:if="${c.system}" class="badge badge-info">Системная</span>
                        <span th:unless="${c.system}" class="badge badge-neutral">Пользовательская</span>
                    </td>
                    <td class="row-actions">
                        <details th:if="${canManageSystem or !c.system}" class="text-sm">
                            <summary class="btn btn-ghost btn-sm">Изменить</summary>
                            <form th:action="@{/nomenclature/categories/save}" method="post" style="margin-top:0.5rem;padding:0.5rem;background:#f8fafc;border-radius:6px">
                                <input type="hidden" name="id" th:value="${c.id}"/>
                                <input type="text" name="name" th:value="${c.name}" class="form-control form-control-sm" required/>
                                <input type="text" name="code" th:value="${c.code}" class="form-control form-control-sm mt-05" placeholder="Код"/>
                                <label th:if="${canManageSystem}" class="form-check mt-05">
                                    <input type="checkbox" name="system" value="true" th:checked="${c.system}"/>
                                    <span>Системная</span>
                                </label>
                                <button type="submit" class="btn btn-primary btn-sm mt-05">Сохранить</button>
                            </form>
                        </details>
                        <span th:if="${!canManageSystem and c.system}" class="text-muted text-xs">Только просмотр</span>
                        <form th:if="${canManageSystem or !c.system}"
                              th:action="@{/nomenclature/categories/delete/{id}(id=${c.id})}" method="post" style="display:inline"
                              onsubmit="return confirm('Удалить категорию?');">
                            <button type="submit" class="btn btn-ghost btn-sm text-danger" title="Удалить">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${categories.isEmpty()}">
                    <td colspan="4" class="text-center text-muted p-1">Категорий пока нет</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</html>
