<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(${pageTitle}, ${activeNav}, ~{::section})}">
<section th:fragment="section">
    <div class="breadcrumb">
        <a th:href="@{/dashboard}">Главная</a> <span class="breadcrumb-sep">/</span> <span>Номенклатура</span>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 style="margin:0;">🏪 Справочник товаров</h3>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
                <a th:href="@{/nomenclature/create}" class="btn btn-primary btn-sm">
                    <i class="fas fa-plus"></i> Добавить номенклатуру
                </a>
                <a th:href="@{/nomenclature/categories}" class="btn btn-secondary btn-sm">
                    <i class="fas fa-tags"></i> Категории
                </a>
            </div>
        </div>

        <form th:action="@{/nomenclature}" method="get" class="filter-bar">
            <div class="form-group">
                <label for="fSearch">Поиск</label>
                <input type="text" id="fSearch" name="q" th:value="${param.q}" class="form-control" placeholder="Название, МНН, штрихкод...">
            </div>
            <div class="form-group">
                <label for="fAtx">Код АТХ</label>
                <input type="text" id="fAtx" name="atx" th:value="${param.atx}" class="form-control" placeholder="Напр. C03">
            </div>
            <div class="form-group">
                <label for="fCategory">Категория</label>
                <select id="fCategory" name="category" class="form-control">
                    <option value="">Все</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${param.category == cat.id}">Категория</option>
                </select>
            </div>
            <div class="form-group">
                <label for="fFlags">Особые</label>
                <select id="fFlags" name="flags" class="form-control">
                    <option value="">Все</option>
                    <option value="rx" th:selected="${param.flags=='rx'}">Только рецептурные</option>
                    <option value="narcotic" th:selected="${param.flags=='narcotic'}">Наркотические</option>
                    <option value="psychotropic" th:selected="${param.flags=='psychotropic'}">Психотропные</option>
                </select>
            </div>
            <div class="form-group" style="flex:0;">
                <label>&nbsp;</label>
                <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-search"></i> Найти</button>
                <a th:href="@{/nomenclature}" class="btn btn-ghost btn-sm"><i class="fas fa-undo"></i></a>
            </div>
        </form>

        <div class="table-responsive nom-table-wrap">
            <table class="data-table nomenclature-table" id="nomTable">
                <thead>
                <tr>
                    <th class="nom-col-name">
                        Наименование
                        <a th:href="@{/nomenclature(sort='tradeName',dir=${sortDir=='asc'?'desc':'asc'},q=${param.q},atx=${param.atx},category=${param.category},flags=${param.flags})}" class="btn btn-ghost btn-sm" style="padding:0 0.2rem;vertical-align:middle;">
                            <i th:class="${sortField=='tradeName'?(sortDir=='asc'?'fas fa-sort-up':'fas fa-sort-down'):'fas fa-sort'}"></i>
                        </a>
                    </th>
                    <th class="nom-col-mnn">МНН</th>
                    <th class="nom-col-atx">АТХ</th>
                    <th class="nom-col-form">Форма</th>
                    <th class="nom-col-manufacturer">Производитель</th>
                    <th class="nom-col-min">Мин.</th>
                    <th class="nom-col-status">Статус</th>
                    <th class="nom-col-actions"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="nom : ${nomenclatures}">
                    <td class="nom-col-name">
                        <div class="truncate font-bold" th:text="${nom.brandName}">Название</div>
                        <div class="text-xs text-muted" style="display:flex;flex-wrap:wrap;gap:0.25rem;align-items:center;margin-top:0.15rem">
                            <span class="badge badge-neutral" th:text="${@nomenclature.productTypeShort(nom.productType)}">ЛС</span>
                            <span th:if="${nom.barcode != null and !nom.barcode.isBlank()}" class="text-xs text-muted truncate" th:text="${nom.barcode}"></span>
                        </div>
                    </td>
                    <td class="nom-col-mnn truncate" th:text="${nom.mnn != null ? nom.mnn : '—'}">MNN</td>
                    <td class="nom-col-atx"><span class="badge badge-info" th:text="${nom.atxCode}">C03</span></td>
                    <td class="nom-col-form">
                        <div class="truncate" th:text="${@nomenclature.formOfRelease(nom.formOfRelease)}">Таблетки</div>
                        <div class="truncate text-xs text-muted" th:text="${@nomenclature.dosageLine(nom.dosage, nom.dosageUnit)}">200 мг</div>
                    </td>
                    <td class="nom-col-manufacturer">
                        <div class="truncate" th:text="${nom.manufacturer}">Производитель</div>
                        <div class="truncate text-xs text-muted" th:text="${nom.country}">Страна</div>
                    </td>
                    <td class="nom-col-min" th:text="${nom.minStockLevel}">10</td>
                    <td class="nom-col-status">
                        <span th:if="${nom.receipt}" class="badge badge-warning" title="По рецепту">📋</span>
                        <span th:if="${nom.narcotic}" class="badge badge-danger" title="Наркотическое">⚠️</span>
                        <span th:if="${nom.psychotropic}" class="badge badge-danger" title="Психотропное">🧠</span>
                        <span th:if="${nom.receipt != true && nom.narcotic != true && nom.psychotropic != true}" class="badge badge-success">Без рец.</span>
                    </td>
                    <td class="row-actions nom-col-actions">
                        <a th:href="@{/nomenclature/edit/{id}(id=${nom.id})}" class="btn btn-ghost btn-sm" title="Редактировать"><i class="fas fa-pen"></i></a>
                        <a th:href="@{/nomenclature/delete/{id}(id=${nom.id})}" class="btn btn-ghost btn-sm text-danger" title="Удалить" onclick="return confirm('Удалить номенклатуру?')"><i class="fas fa-trash"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(nomenclatures)}">
                    <td colspan="8" class="text-center text-muted p-1">
                        Номенклатура не найдена. <a th:href="@{/nomenclature/create}">Добавить первую запись</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" th:if="${totalPages > 1}">
            <a th:href="@{/nomenclature(page=${currentPage - 1}, size=${pageSize}, sort=${sortField}, dir=${sortDir}, q=${param.q}, atx=${param.atx}, category=${param.category}, flags=${param.flags})}"
               class="page-btn" th:if="${currentPage > 0}">←</a>
            <th:block th:each="i : ${#numbers.sequence(
          currentPage > 1 ? currentPage - 1 : 0,
          currentPage < totalPages - 2 ? currentPage + 1 : totalPages - 1)}">
                <a th:if="${i == currentPage}" class="page-btn active" th:text="${i+1}">1</a>
                <a th:unless="${i == currentPage}"
                   th:href="@{/nomenclature(page=${i}, size=${pageSize}, sort=${sortField}, dir=${sortDir}, q=${param.q}, atx=${param.atx}, category=${param.category}, flags=${param.flags})}"
                   class="page-btn" th:text="${i+1}">2</a>
            </th:block>
            <a th:href="@{/nomenclature(page=${currentPage + 1}, size=${pageSize}, sort=${sortField}, dir=${sortDir}, q=${param.q}, atx=${param.atx}, category=${param.category}, flags=${param.flags})}"
               class="page-btn" th:if="${currentPage < totalPages - 1}">→</a>
        </div>
    </div>
</section>
</html>
