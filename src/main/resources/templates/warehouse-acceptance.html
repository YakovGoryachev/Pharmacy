<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(${pageTitle}, ${activeNav}, ~{::section})}">
<section th:fragment="section">
    <div class="breadcrumb">
        <a th:href="@{/batches}">Склад</a> <span class="breadcrumb-sep">/</span> <span>Приёмка партии</span>
    </div>

    <div class="card" style="max-width:1000px">
        <form th:action="@{/batches/create}" th:object="${batchCommand}" method="post" id="acceptanceForm">
            <div class="card-body">
                <div class="form-group">
                    <label class="form-label">Аптека (точка приёмки)</label>
                    <select name="pharmacyId" class="form-control form-select" required>
                        <option th:each="p : ${pharmacies}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>

                <h3 style="margin:1.5rem 0 1rem;border-bottom:1px solid var(--border);padding-bottom:0.5rem">
                    <i class="fas fa-capsules text-primary"></i> Выбор товара
                </h3>

                <div class="form-group">
                    <label class="form-label">Номенклатура (товар)</label>
                    <div th:if="${nomenclatureError}" class="alert alert-danger" th:text="${nomenclatureError}"></div>
                    <div style="position:relative">
                        <input type="text" id="nomenclatureSearch" class="form-control"
                               th:classappend="${nomenclatureError} ? 'is-invalid'"
                               placeholder="Начните вводить название..." autocomplete="off"/>
                        <div id="nomenclatureDropdown" class="card"
                             style="position:absolute;top:100%;left:0;right:0;z-index:100;max-height:250px;overflow-y:auto;display:none;margin-top:4px;box-shadow:var(--shadow-md)"></div>
                    </div>
                    <input type="hidden" th:field="*{nomenclatureId}" id="selectedNomenclatureId"/>
                    <div id="selectedNomenclatureInfo" class="mt-1 text-sm text-muted"
                         th:style="${selectedNomenclatureText != null} ? 'display:block' : 'display:none'">
                        Выбрано: <strong id="selectedNomenclatureText" th:text="${selectedNomenclatureText}"></strong>
                        <span th:if="${selectedNomenclatureMarked}" class="badge badge-info" style="margin-left:0.5rem">Маркированный</span>
                        <button type="button" class="btn btn-ghost btn-sm" onclick="clearSelection()" style="padding:0 0.3rem;margin-left:0.5rem">✕</button>
                    </div>
                    <div class="form-helper">Минимум 2 символа для поиска.</div>
                </div>
                <a th:href="@{/nomenclature/create}" class="btn btn-secondary btn-sm">
                    <i class="fas fa-plus"></i> Создать новый товар
                </a>
            </div>

            <div class="card-body" style="background:#fafbfc">
                <h3 style="margin-bottom:1rem;border-bottom:1px solid var(--border);padding-bottom:0.5rem">
                    <i class="fas fa-barcode text-primary"></i> Информация о партии
                </h3>
                <div class="grid-2" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem">
                    <div class="form-group">
                        <label class="form-label">Номер партии</label>
                        <input type="text" th:field="*{batchNumber}" class="form-control" placeholder="P-10023" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Поставщик</label>
                        <input type="text" th:field="*{supplier}" class="form-control" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Дата поступления</label>
                        <input type="date" th:field="*{receivedDate}" class="form-control" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Дата производства</label>
                        <input type="date" th:field="*{productionDate}" class="form-control"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Срок годности</label>
                        <input type="date" th:field="*{expiryDate}" class="form-control" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Цена, ₽</label>
                        <input type="number" step="0.01" min="0" th:field="*{priceRubles}" class="form-control" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Зона хранения</label>
                        <select th:field="*{storageZone}" class="form-control form-select" required>
                            <option value="Зал">Зал</option>
                            <option value="ROOM_TEMP">Комнатная температура</option>
                            <option value="FRIDGE">Холодильник (2–8°C)</option>
                            <option value="DARK">Тёмное место</option>
                            <option value="FREEZER">Морозильная камера</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Кол-во полученных</label>
                        <input type="number" th:field="*{qtyReceived}" class="form-control" id="qtyReceived" required min="1" oninput="syncQty(); updateScannerVisibility()"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Кол-во оставшихся</label>
                        <input type="number" th:field="*{qtyInStock}" class="form-control" id="qtyRemaining" readonly style="background:#f1f5f9"/>
                    </div>
                </div>

                <div id="markingScanner" class="form-group mt-1" style="display:none">
                    <label class="form-label">
                        Маркировка Data Matrix
                        <span id="markingCounter" class="text-muted text-sm"></span>
                    </label>
                    <div th:if="${markingError}" class="alert alert-danger" th:text="${markingError}"></div>
                    <div style="display:flex;gap:0.5rem;align-items:flex-start">
                        <input type="text" id="markingScanInput" class="form-control"
                               placeholder="Сканируйте или введите код..." autocomplete="off"/>
                        <button type="button" id="markingAcceptBtn" class="btn btn-secondary" style="white-space:nowrap">
                            Принять
                        </button>
                    </div>
                    <ul id="markingCodeList" style="list-style:none;padding:0;margin:0.75rem 0 0;font-size:0.875rem"></ul>
                    <div id="markingCodesHidden"></div>
                    <div class="form-helper">Отсканируйте код каждой упаковки. Число кодов должно совпасть с количеством в партии.</div>
                </div>

                <div class="form-group mt-1">
                    <label class="form-check">
                        <input type="checkbox" th:field="*{writtenOff}"/>
                        <span>Партия списана (брак/возврат)</span>
                    </label>
                </div>
            </div>

            <div class="card-footer" style="display:flex;justify-content:space-between;padding:1rem">
                <a th:href="@{/batches}" class="btn btn-ghost">Отмена</a>
                <button type="submit" class="btn btn-primary" id="submitAcceptanceBtn">
                    <i class="fas fa-check"></i> Провести приёмку
                </button>
            </div>
        </form>
    </div>

    <script th:inline="javascript">
        function debounce(fn, delay) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        const searchInput = document.getElementById('nomenclatureSearch');
        const dropdown = document.getElementById('nomenclatureDropdown');
        const selectedIdInput = document.getElementById('selectedNomenclatureId');
        const selectedInfo = document.getElementById('selectedNomenclatureInfo');
        const selectedText = document.getElementById('selectedNomenclatureText');
        const markingScanner = document.getElementById('markingScanner');
        const markingScanInput = document.getElementById('markingScanInput');
        const markingAcceptBtn = document.getElementById('markingAcceptBtn');
        const markingCodeList = document.getElementById('markingCodeList');
        const markingCodesHidden = document.getElementById('markingCodesHidden');
        const markingCounter = document.getElementById('markingCounter');
        const acceptanceForm = document.getElementById('acceptanceForm');

        let selectedMarked = [[${selectedNomenclatureMarked != null && selectedNomenclatureMarked}]];
        const scannedCodes = /*[[${scannedMarkingCodes}]]*/ [];

        if (searchInput) {
            searchInput.addEventListener('input', debounce(async function () {
                const query = searchInput.value.trim();
                if (query.length < 2) {
                    dropdown.style.display = 'none';
                    return;
                }
                try {
                    const response = await fetch('/api/nomenclature/search?query=' + encodeURIComponent(query));
                    if (!response.ok) throw new Error('Network error');
                    renderDropdown(await response.json());
                } catch (error) {
                    dropdown.innerHTML = '<div class="p-2 text-danger text-sm">Ошибка загрузки</div>';
                    dropdown.style.display = 'block';
                }
            }, 300));
        }

        function renderDropdown(items) {
            if (!items || items.length === 0) {
                dropdown.innerHTML = '<div class="p-2 text-muted text-sm">Ничего не найдено</div>';
                dropdown.style.display = 'block';
                return;
            }
            dropdown.innerHTML = items.map(item => `
                <div class="p-2 nomenclature-item border-bottom"
                     data-id="${item.id}"
                     data-marked="${item.marked === true}"
                     data-text="${escapeHtml(item.displayText || item.brandName)}"
                     style="cursor:pointer">
                    <div class="font-bold">
                        ${escapeHtml(item.brandName)} ${item.dosage || ''} ${item.dosageUnit || ''}
                        ${item.marked ? '<span class="badge badge-info" style="margin-left:0.25rem">Марк.</span>' : ''}
                    </div>
                    <div class="text-xs text-muted">${escapeHtml(item.mnn)} • ${escapeHtml(item.formOfReleaseLabel || item.formOfRelease)}</div>
                </div>
            `).join('');
            dropdown.style.display = 'block';
        }

        dropdown.addEventListener('click', function (e) {
            const item = e.target.closest('.nomenclature-item');
            if (!item) return;
            selectedIdInput.value = item.dataset.id;
            selectedText.textContent = item.dataset.text;
            selectedMarked = item.dataset.marked === 'true';
            selectedInfo.style.display = 'block';
            searchInput.value = '';
            dropdown.style.display = 'none';
            updateScannerVisibility();
        });

        function clearSelection() {
            selectedIdInput.value = '';
            selectedInfo.style.display = 'none';
            selectedMarked = false;
            scannedCodes.length = 0;
            renderMarkingList();
            updateScannerVisibility();
            searchInput.focus();
        }

        document.addEventListener('click', function (e) {
            if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function syncQty() {
            const received = document.getElementById('qtyReceived')?.value;
            const remaining = document.getElementById('qtyRemaining');
            if (remaining) remaining.value = received || '';
        }

        function expectedQty() {
            const v = parseInt(document.getElementById('qtyReceived')?.value, 10);
            return Number.isFinite(v) && v > 0 ? v : 0;
        }

        function updateScannerVisibility() {
            const show = selectedMarked && expectedQty() > 0;
            if (markingScanner) {
                markingScanner.style.display = show ? 'block' : 'none';
            }
            if (show && markingScanInput) {
                markingScanInput.disabled = scannedCodes.length >= expectedQty();
            }
            updateMarkingCounter();
        }

        function updateMarkingCounter() {
            if (!markingCounter) return;
            const expected = expectedQty();
            if (selectedMarked && expected > 0) {
                markingCounter.textContent = `(${scannedCodes.length} / ${expected})`;
            } else {
                markingCounter.textContent = '';
            }
        }

        function renderMarkingList() {
            if (!markingCodeList || !markingCodesHidden) return;
            markingCodeList.innerHTML = scannedCodes.map((code, index) => `
                <li style="display:flex;align-items:center;gap:0.5rem;padding:0.25rem 0;border-bottom:1px solid var(--border)">
                    <span style="flex:1;word-break:break-all;font-family:monospace">${escapeHtml(code)}</span>
                    <button type="button" class="btn btn-ghost btn-sm" data-index="${index}" title="Удалить">✕</button>
                </li>
            `).join('');
            markingCodesHidden.innerHTML = '';
            scannedCodes.forEach(code => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'markingCodes';
                input.value = code;
                markingCodesHidden.appendChild(input);
            });
            markingCodeList.querySelectorAll('button[data-index]').forEach(btn => {
                btn.addEventListener('click', () => {
                    scannedCodes.splice(parseInt(btn.dataset.index, 10), 1);
                    renderMarkingList();
                    updateScannerVisibility();
                });
            });
            updateMarkingCounter();
        }

        function acceptMarkingCode() {
            if (!selectedMarked || expectedQty() <= 0) return;
            const code = markingScanInput?.value.trim();
            if (!code) return;
            if (scannedCodes.includes(code)) {
                alert('Этот код уже добавлен');
                markingScanInput.select();
                return;
            }
            if (scannedCodes.length >= expectedQty()) {
                alert('Уже отсканировано достаточно кодов');
                return;
            }
            scannedCodes.push(code);
            markingScanInput.value = '';
            renderMarkingList();
            updateScannerVisibility();
            if (scannedCodes.length < expectedQty()) {
                markingScanInput.focus();
            }
        }

        markingAcceptBtn?.addEventListener('click', acceptMarkingCode);
        markingScanInput?.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                acceptMarkingCode();
            }
        });

        acceptanceForm?.addEventListener('submit', function (e) {
            if (!selectedMarked) return;
            const expected = expectedQty();
            if (expected <= 0) {
                e.preventDefault();
                alert('Укажите количество упаковок в партии');
                return;
            }
            if (scannedCodes.length !== expected) {
                e.preventDefault();
                alert(`Отсканируйте все коды: ${scannedCodes.length} из ${expected}`);
            }
        });

        document.getElementById('qtyReceived')?.addEventListener('input', function () {
            while (scannedCodes.length > expectedQty()) {
                scannedCodes.pop();
            }
            renderMarkingList();
            updateScannerVisibility();
        });

        renderMarkingList();
        updateScannerVisibility();
        syncQty();
    </script>
</section>
</html>
