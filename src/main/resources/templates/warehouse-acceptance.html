<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(${pageTitle}, ${activeNav}, ~{::section})}">
<section th:fragment="section">
    <div class="breadcrumb">
        <a th:href="@{/batches}">Склад</a> <span class="breadcrumb-sep">/</span> <span>Приёмка партии</span>
    </div>

    <div class="card" style="max-width:1000px">
        <form th:action="@{/batches/create}" th:object="${batchCommand}" method="post">
            <div class="card-body">
                <div class="form-group">
                    <label class="form-label">Аптека (точка приёмки)</label>
                    <select name="pharmacyId" class="form-control form-select" required>
                        <option th:each="p : ${pharmacies}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Код маркировки (Data Matrix, опционально)</label>
                    <input type="text" name="markingCode" class="form-control" placeholder="Скан или ввод кода"/>
                </div>

                <h3 style="margin:1.5rem 0 1rem;border-bottom:1px solid var(--border);padding-bottom:0.5rem">
                    <i class="fas fa-capsules text-primary"></i> Выбор товара
                </h3>

                <div class="form-group">
                    <label class="form-label">Номенклатура (товар)</label>
                    <div th:if="${nomenclatureError}" class="alert alert-danger" th:text="${nomenclatureError}"></div>
                    <div style="position:relative">
                        <input type="text" id="nomenclatureSearch" class="form-control"
                               th:classappend="${nomenclatureError} ? 'is-invalid'"
                               placeholder="Начните вводить название..." autocomplete="off"/>
                        <div id="nomenclatureDropdown" class="card"
                             style="position:absolute;top:100%;left:0;right:0;z-index:100;max-height:250px;overflow-y:auto;display:none;margin-top:4px;box-shadow:var(--shadow-md)"></div>
                    </div>
                    <input type="hidden" th:field="*{nomenclatureId}" id="selectedNomenclatureId"/>
                    <div id="selectedNomenclatureInfo" class="mt-1 text-sm text-muted" style="display:none">
                        Выбрано: <strong id="selectedNomenclatureText"></strong>
                        <button type="button" class="btn btn-ghost btn-sm" onclick="clearSelection()" style="padding:0 0.3rem;margin-left:0.5rem">✕</button>
                    </div>
                    <div class="form-helper">Минимум 2 символа для поиска.</div>
                </div>
                <a th:href="@{/nomenclature/create}" class="btn btn-secondary btn-sm">
                    <i class="fas fa-plus"></i> Создать новый товар
                </a>
            </div>

            <div class="card-body" style="background:#fafbfc">
                <h3 style="margin-bottom:1rem;border-bottom:1px solid var(--border);padding-bottom:0.5rem">
                    <i class="fas fa-barcode text-primary"></i> Информация о партии
                </h3>
                <div class="grid-2" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem">
                    <div class="form-group">
                        <label class="form-label">Номер партии</label>
                        <input type="text" th:field="*{batchNumber}" class="form-control" placeholder="P-10023" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Поставщик</label>
                        <input type="text" th:field="*{supplier}" class="form-control" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Дата поступления</label>
                        <input type="date" th:field="*{receivedDate}" class="form-control" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Дата производства</label>
                        <input type="date" th:field="*{productionDate}" class="form-control"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Срок годности</label>
                        <input type="date" th:field="*{expiryDate}" class="form-control" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Цена, ₽</label>
                        <input type="number" step="0.01" min="0" th:field="*{priceRubles}" class="form-control" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Зона хранения</label>
                        <select th:field="*{storageZone}" class="form-control form-select" required>
                            <option value="Зал">Зал</option>
                            <option value="ROOM_TEMP">Комнатная температура</option>
                            <option value="FRIDGE">Холодильник (2–8°C)</option>
                            <option value="DARK">Тёмное место</option>
                            <option value="FREEZER">Морозильная камера</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Кол-во полученных</label>
                        <input type="number" th:field="*{qtyReceived}" class="form-control" id="qtyReceived" required oninput="syncQty()"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Кол-во оставшихся</label>
                        <input type="number" th:field="*{qtyInStock}" class="form-control" id="qtyRemaining" readonly style="background:#f1f5f9"/>
                    </div>
                </div>
                <div class="form-group mt-1">
                    <label class="form-check">
                        <input type="checkbox" th:field="*{writtenOff}"/>
                        <span>Партия списана (брак/возврат)</span>
                    </label>
                </div>
            </div>

            <div class="card-footer" style="display:flex;justify-content:space-between;padding:1rem">
                <a th:href="@{/batches}" class="btn btn-ghost">Отмена</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-check"></i> Провести приёмку
                </button>
            </div>
        </form>
    </div>

    <script th:inline="javascript">
        function debounce(fn, delay) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        const searchInput = document.getElementById('nomenclatureSearch');
        const dropdown = document.getElementById('nomenclatureDropdown');
        const selectedIdInput = document.getElementById('selectedNomenclatureId');
        const selectedInfo = document.getElementById('selectedNomenclatureInfo');
        const selectedText = document.getElementById('selectedNomenclatureText');

        if (searchInput) {
            searchInput.addEventListener('input', debounce(async function () {
                const query = searchInput.value.trim();
                if (query.length < 2) {
                    dropdown.style.display = 'none';
                    return;
                }
                try {
                    const response = await fetch('/api/nomenclature/search?query=' + encodeURIComponent(query));
                    if (!response.ok) throw new Error('Network error');
                    renderDropdown(await response.json());
                } catch (error) {
                    dropdown.innerHTML = '<div class="p-2 text-danger text-sm">Ошибка загрузки</div>';
                    dropdown.style.display = 'block';
                }
            }, 300));
        }

        function renderDropdown(items) {
            if (!items || items.length === 0) {
                dropdown.innerHTML = '<div class="p-2 text-muted text-sm">Ничего не найдено</div>';
                dropdown.style.display = 'block';
                return;
            }
            dropdown.innerHTML = items.map(item => `
                <div class="p-2 nomenclature-item border-bottom" data-id="${item.id}" data-text="${escapeHtml(item.displayText || item.brandName)}" style="cursor:pointer">
                    <div class="font-bold">${escapeHtml(item.brandName)} ${item.dosage || ''} ${item.dosageUnit || ''}</div>
                    <div class="text-xs text-muted">${escapeHtml(item.mnn)} • ${escapeHtml(item.formOfRelease)}</div>
                </div>
            `).join('');
            dropdown.style.display = 'block';
        }

        dropdown.addEventListener('click', function (e) {
            const item = e.target.closest('.nomenclature-item');
            if (!item) return;
            selectedIdInput.value = item.dataset.id;
            selectedText.textContent = item.dataset.text;
            selectedInfo.style.display = 'block';
            searchInput.value = '';
            dropdown.style.display = 'none';
        });

        function clearSelection() {
            selectedIdInput.value = '';
            selectedInfo.style.display = 'none';
            searchInput.focus();
        }

        document.addEventListener('click', function (e) {
            if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function syncQty() {
            const received = document.getElementById('qtyReceived')?.value;
            const remaining = document.getElementById('qtyRemaining');
            if (remaining) remaining.value = received || '';
        }
    </script>
</section>
</html>
