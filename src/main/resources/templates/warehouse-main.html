<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Склад и Партии', ${activeNav}, ~{::section})}">
<section th:fragment="section">
    <div class="breadcrumb">
        <a th:href="@{/dashboard}">Главная</a> <span class="breadcrumb-sep">/</span> <span>Склад и Партии</span>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">📦 Реестр партий лекарственных средств</div>
            <div style="display:flex;flex-wrap:wrap;gap:0.5rem">
                <a th:href="@{/batches/create}" class="btn btn-success btn-sm">
                    <i class="fas fa-plus"></i> Приёмка ЛП
                </a>
                <a th:href="@{/batches/expiring}" class="btn btn-sm btn-warning">Сроки</a>
                <a th:href="@{/batches/writeoff}" class="btn btn-sm btn-danger">Списание</a>
                <a th:href="@{/batches/transfer}" class="btn btn-sm btn-secondary">Перемещение</a>
                <a th:href="@{/batches/inventory}" class="btn btn-sm btn-secondary">Инвентаризация</a>
                <a th:href="@{/batches/marking}" class="btn btn-sm btn-secondary">Маркировка</a>
            </div>
        </div>

        <form th:action="@{/batches}" method="get" class="filter-bar">
            <div class="form-group">
                <label for="filterBatchNumber">Номер партии</label>
                <input type="text" id="filterBatchNumber" name="numBatch" class="form-control"
                       th:value="${param.numBatch}" placeholder="Напр. #P-119">
            </div>
            <div class="form-group">
                <label for="filterSupplier">Поставщик</label>
                <input type="text" id="filterSupplier" name="supplier" class="form-control"
                       th:value="${param.supplier}" placeholder="Название поставщика">
            </div>
            <div class="form-group">
                <label for="filterArrivalFrom">Дата прибытия</label>
                <input type="date" id="filterArrivalFrom" name="dateEntrance" class="form-control"
                       th:value="${param.dateEntrance}">
            </div>
            <div class="form-group">
                <label for="filterExpiryFrom">Срок годности</label>
                <input type="date" id="filterExpiryFrom" name="expiryDate" class="form-control"
                       th:value="${param.expiryDate}">
            </div>
            <div class="form-group" style="flex:0;">
                <label>&nbsp;</label>
                <button type="submit" class="btn btn-primary btn-sm">
                    <i class="fas fa-search"></i> Найти
                </button>
                <a th:href="@{/batches}" class="btn btn-ghost btn-sm">
                    <i class="fas fa-undo"></i>
                </a>
            </div>
        </form>

        <div class="table-responsive">
            <table class="data-table batch-table" id="batchesTable">
                <thead>
                <tr>
                    <th>Номер партии</th>
                    <th>Препарат / МНН</th>
                    <th>Поставщик</th>
                    <th>Дата прибытия</th>
                    <th>Дата производства</th>
                    <th>Годен до</th>
                    <th>Цена за ед.</th>
                    <th>Кол-во</th>
                    <th>Зона хранения</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="batch : ${batches.content}" th:classappend="${batch.writtenOff} ? 'row-written-off' : ''">
                    <td><strong th:text="${batch.batchNumber}"></strong></td>
                    <td>
                        <div class="font-bold" th:text="${batch.nomenclature.brandName}"></div>
                        <div class="text-xs text-muted" th:text="${batch.nomenclature.mnn}"></div>
                    </td>
                    <td th:text="${batch.supplier}"></td>
                    <td th:text="${batch.receivedDate}"></td>
                    <td th:text="${batch.productionDate}"></td>
                    <td th:text="${batch.expiryDate}"></td>
                    <td th:text="${@money.rubles(batch.price)}"></td>
                    <td th:text="${batch.qtyReceived}"></td>
                    <td><span class="storage-zone" th:text="${batch.storageZone}"></span></td>
                    <td>
                        <span th:if="${batch.writtenOff}" class="badge badge-danger">
                            <span class="status-dot dot-written-off"></span> Списана
                        </span>
                        <span th:unless="${batch.writtenOff}" class="badge badge-success">
                            <span class="status-dot dot-active"></span> В наличии
                        </span>
                    </td>
                    <td class="row-actions">
                        <a th:href="@{/batches/edit/{id}(id=${batch.id})}" class="btn btn-ghost btn-sm" title="Редактировать">
                            <i class="fas fa-pen"></i>
                        </a>
                        <form th:action="@{/batches/delete/{id}(id=${batch.id})}" method="post" style="display:inline"
                              onsubmit="return confirm('Удалить эту партию?');">
                            <button type="submit" class="btn btn-ghost btn-sm text-danger" title="Удалить">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${batches.content.isEmpty()}">
                    <td colspan="11" class="text-center text-muted p-1">Партии не найдены</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" th:if="${totalPages > 1}">
            <a th:href="@{/batches(page=${currentPage - 1}, size=${pageSize}, sort=${sortField}, dir=${sortDir}, numBatch=${param.numBatch}, supplier=${param.supplier}, dateEntrance=${param.dateEntrance}, expiryDate=${param.expiryDate})}"
               class="page-btn" th:if="${currentPage > 0}">←</a>
            <th:block th:each="i : ${#numbers.sequence(
                currentPage > 1 ? currentPage - 1 : 0,
                currentPage < totalPages - 2 ? currentPage + 1 : totalPages - 1)}">
                <a th:if="${i == currentPage}" class="page-btn active" th:text="${i + 1}">1</a>
                <a th:unless="${i == currentPage}"
                   th:href="@{/batches(page=${i}, size=${pageSize}, sort=${sortField}, dir=${sortDir}, numBatch=${param.numBatch}, supplier=${param.supplier}, dateEntrance=${param.dateEntrance}, expiryDate=${param.expiryDate})}"
                   class="page-btn" th:text="${i + 1}">2</a>
            </th:block>
            <a th:href="@{/batches(page=${currentPage + 1}, size=${pageSize}, sort=${sortField}, dir=${sortDir}, numBatch=${param.numBatch}, supplier=${param.supplier}, dateEntrance=${param.dateEntrance}, expiryDate=${param.expiryDate})}"
               class="page-btn" th:if="${currentPage < totalPages - 1}">→</a>
        </div>
    </div>
</section>
</html>
